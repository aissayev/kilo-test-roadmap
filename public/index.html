<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kilo Test Roadmap</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 48px 40px;
      backdrop-filter: blur(8px);
    }
    .badge {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 999px;
      padding: 4px 14px;
      margin-bottom: 24px;
    }
    h1 { font-size: 2rem; margin-bottom: 12px; line-height: 1.2; }
    p { color: #94a3b8; line-height: 1.6; font-size: 1rem; }
    .footer { margin-top: 28px; font-size: 13px; color: #64748b; }
    a { color: #38bdf8; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Live on Netlify</span>
    <h1>Kilo Test Roadmap</h1>
    <p>This site is deployed and running. Edit <code>public/index.html</code>, push, and Netlify redeploys automatically.</p>
    <p class="footer">Built with Claude Code</p>
  </main>
</body>
</html>
